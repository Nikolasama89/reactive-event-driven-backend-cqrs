plugins {
    id 'java'
}

group = 'com.itsaur'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation platform('io.projectreactor:reactor-bom:2025.0.1')
    implementation 'io.projectreactor:reactor-core'
    implementation 'io.projectreactor.netty:reactor-netty-core'
    implementation 'io.projectreactor.netty:reactor-netty-http'
    // https://mvnrepository.com/artifact/io.r2dbc/r2dbc-pool
    implementation("io.r2dbc:r2dbc-pool:1.0.2.RELEASE")
    // https://mvnrepository.com/artifact/org.postgresql/r2dbc-postgresql
    implementation("org.postgresql:r2dbc-postgresql:1.1.1.RELEASE")
    // https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-databind
    implementation("com.fasterxml.jackson.core:jackson-databind:2.20.1")
    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation("org.slf4j:slf4j-api:2.0.17")
    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    runtimeOnly("org.slf4j:slf4j-api:2.0.17")
    implementation 'ch.qos.logback:logback-classic:1.5.23'
    // https://mvnrepository.com/artifact/com.fasterxml.jackson.datatype/jackson-datatype-jsr310
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.20.1'
    // https://mvnrepository.com/artifact/org.json/json
    implementation 'org.json:json:20251224'
    implementation 'co.elastic.clients:elasticsearch-java:8.12.0'
}

test {
    useJUnitPlatform()
}